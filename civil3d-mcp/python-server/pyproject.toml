[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "civil3d-mcp"
version = "0.1.0"
description = "MCP server that connects AI agents to Autodesk Civil 3D"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
civil3d-mcp = "civil3d_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/civil3d_mcp"]
